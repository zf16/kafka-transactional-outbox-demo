server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/outbox_demo?currentSchema=payment_service}
    username: ${DB_USERNAME:outbox}
    password: ${DB_PASSWORD:outbox}
  flyway:
    schemas: payment_service
    default-schema: payment_service
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

payment:
  topic: ${FLIGHT_TOPIC:flight.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.outbox: DEBUG
