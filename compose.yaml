services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: outbox_demo
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 3s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic flight.events
        --partitions 1
        --replication-factor 1

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/outbox_demo?currentSchema=flight_service
      DB_USERNAME: outbox
      DB_PASSWORD: outbox
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  event-processing-service:
    build:
      context: .
      dockerfile: event-processing-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/outbox_demo?currentSchema=flight_service
      DB_USERNAME: outbox
      DB_PASSWORD: outbox
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLIGHT_TOPIC: flight.events
      OUTBOX_POLL_DELAY: 10000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      flight-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/outbox_demo?currentSchema=payment_service
      DB_USERNAME: outbox
      DB_PASSWORD: outbox
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLIGHT_TOPIC: flight.events
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
